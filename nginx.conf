server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------
    # Compresión
    # -------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # -------------------------
    # HTML — NO cachear
    # -------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Si usas SPA (React, Angular, Vue, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Alias para rutas generadas con prefijo /browser/
    # Algunos builds de Angular generan enlaces absolutos a /browser/…
    # si los ficheros se despliegan en la raíz, esto provoca 404.
    # Este bloque mapea /browser/<file> -> /usr/share/nginx/html/<file>
    location ^~ /browser/ {
        alias /usr/share/nginx/html/browser/;
        # No fallback a index; servir directamente o 404 si no existe
        try_files $uri $uri/ =404;
    }

    # -------------------------
    # JS y CSS — caché muy larga
    # -------------------------
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -------------------------
    # Imágenes — caché larga
    # -------------------------
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 6M;
        add_header Cache-Control "public, max-age=15552000";
    }

    # -------------------------
    # Fuentes — caché larga
    # -------------------------
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -------------------------
    # Assets genéricos (fallback)
    # -------------------------
    location /assets/ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # -------------------------
    # API (sin caché)
    # -------------------------
    # location /api/ {
    #     proxy_pass http://backend:3000/;
    #     proxy_set_header Host $host;
    #     add_header Cache-Control "no-store";
    # }
}
