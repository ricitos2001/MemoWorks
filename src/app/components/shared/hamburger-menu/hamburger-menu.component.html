<button class="hamburger" (click)="toggleMenu()" [attr.aria-label]="isOpen ? 'Cerrar menú' : 'Abrir menú'">
  <span *ngIf="!isOpen">☰</span>
  <span *ngIf="isOpen">✕</span>
</button>
<nav class="menu" [class.open]="isOpen">
  <ul class="header__nav">
    <ng-container *ngIf="!loggedIn">
      <li><a href="#inicio" class="header__link">Inicio</a></li>
      <li><a href="#queOfrecemos" class="header__link">Que ofrecemos</a></li>
      <li><a href="#contacto" class="header__link">Contacto</a></li>
      <li><a class="header__link" (click)="openAuthModal('register')">Empecemos</a></li>
    </ng-container>
    <ng-container *ngIf="loggedIn">
      <li><a href="/dashboard" class="header__link">Dashboard</a></li>
      <li><a href="/calendar" class="header__link">Calendario</a></li>
      <li><a href="/settings" class="header__link">Configuración</a></li>
      <li><app-button class="header__logout" (click)="logout()">Cerrar sesión</app-button></li>
    </ng-container>
  </ul>
</nav>
