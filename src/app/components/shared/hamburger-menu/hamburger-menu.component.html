<button #toggleButton class="hamburger" (click)="toggleMenu()" [attr.aria-label]="isOpen ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="isOpen" [attr.aria-controls]="menuId">
  <span *ngIf="!isOpen">☰</span>
  <span *ngIf="isOpen">✕</span>
</button>
<nav [attr.id]="menuId" class="menu" [class.open]="isOpen">
  <ul class="header__nav">
    <ng-container *ngIf="!loggedIn">
      <li><a href="#inicio" class="header__link">Inicio</a></li>
      <li><a href="#queOfrecemos" class="header__link">Que ofrecemos</a></li>
      <li><a href="#contacto" class="header__link">Contacto</a></li>
      <li><app-button class="header__link" (click)="openAuthModal('register')">Empecemos</app-button></li>
    </ng-container>
    <ng-container *ngIf="loggedIn">
      <li><a routerLink="/dashboard" class="header__link">Dashboard</a></li>
      <li><a routerLink="/calendar" class="header__link">Calendario</a></li>
      <li><a routerLink="/settings" class="header__link">Configuración</a></li>
      <li class="flex-center">
        <button class="theme-btn spacing-button" (click)="toggleNotifications()" aria-label="Abrir bandeja de notificaciones" [attr.aria-expanded]="showNotifications" [attr.aria-controls]="notificationsId"><img src="assets/img/Bell.svg" class="bell-icon" alt="Notificaciones"><span class="badge" *ngIf="hasNew"></span></button>
        <app-button class="header__logout" (click)="logout()">Cerrar sesión</app-button>
      </li>
    </ng-container>
  </ul>
</nav>

<aside #notificationsSidebar *ngIf="showNotifications" [attr.id]="notificationsId" class="notifications-tray" role="dialog" aria-label="Bandeja de notificaciones" (keydown.escape)="closeNotifications()" tabindex="-1">
  <article class="notifications-tray__header">
    <h4 class="notifications-tray__title">Notificaciones</h4>
    <button class="notifications-close" (click)="closeNotifications()" aria-label="Cerrar notificaciones">✕</button>
  </article>
  <article class="notifications-tray__body">
    <app-notification></app-notification>
  </article>
</aside>
