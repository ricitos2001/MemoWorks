<section
  class="tooltip-wrapper"
  (mouseenter)="show()"
  (mouseleave)="hide()"
  (focusin)="show()"
  (focusout)="hide()"
>
  <button
    tabindex="0"
    (keydown)="onKey($event)"
    [attr.aria-describedby]="showTooltip ? tooltipId : null"
    [attr.aria-expanded]="showTooltip"
  >
    Hover aquí
  </button>

  <article
    class="tooltip"
    *ngIf="showTooltip"
    [attr.id]="tooltipId"
    role="tooltip"
  >
    Este es un tooltip.
  </article>
</section>
