<form
  class="add-task-form"
  [formGroup]="recoverPasswordForm"
  (ngSubmit)="onSubmit($event)"
  novalidate
>
  <fieldset class="grid-center">
    <legend class="form__legend">Recuperar contraseña</legend>

    <app-form-input
      *ngIf="!token"
      formControlName="email"
      type="email"
      placeholder="Correo electrónico"
      [required]="true"
    ></app-form-input>

    <article class="error" *ngIf="recoverPasswordForm.get('email')?.touched && recoverPasswordForm.get('email')?.invalid">
      <small *ngIf="recoverPasswordForm.get('email')?.errors?.['required']">Correo obligatorio</small>
      <small *ngIf="recoverPasswordForm.get('email')?.errors?.['email']">Correo no válido</small>
    </article>
    <section *ngIf="tokenValid">
      <app-form-input
        formControlName="newPassword"
        type="password"
        placeholder="Nueva contraseña"
        [required]="true"
      ></app-form-input>

      <app-form-input
        formControlName="confirmPassword"
        type="password"
        placeholder="Confirmar contraseña"
        [required]="true"
      ></app-form-input>

      <article class="error" *ngIf="recoverPasswordForm.errors?.['passwordMismatch']">
        <small>Las contraseñas no coinciden</small>
      </article>
    </section>

    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <app-button
      type="submit"
      [disabled]="recoverPasswordForm.invalid || submitted"
    >
      {{ token ? 'Cambiar contraseña' : 'Enviar correo' }}
    </app-button>

    <a href="/login">Volver a iniciar sesión</a>
  </fieldset>
</form>
