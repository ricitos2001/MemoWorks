<article *ngIf="loading()">{{loadingText | translate}}</article>
<article *ngIf="error()">{{ error() }}</article>

<section class="dashboard select-task-for-edit">
  <ul class="tasks-grid" *ngIf="tasks()">
    <li *ngFor="let task of tasks(); trackBy: trackById">
      <section class="task">
        <section class="task__image-box">
          <article id="etiquetas" class="task__labels">
            <ng-container *ngFor="let lbl of task.labels">
              <span class="task__label task__label--small">{{ lbl }}</span>
            </ng-container>
          </article>
        </section>
        <section class="task__box">
          <section class="flex">
            <article class="flex">
              <img src="assets/img/Calendar.svg" alt="icon" loading="lazy" decoding="async">
              <p class="task__text">{{ task.date | date:'dd/MM/yyyy' }}</p>
            </article>
            <article class="flex">
              <img src="assets/img/Clock.svg" alt="icon" loading="lazy" decoding="async">
              <p class="task__text">{{ formatTime(task.time) | date:'HH:mm' }}</p>
            </article>
          </section>
          <section class="flex">
            <article class="flex-center">
              <p class="task__text"><span>{{ task.title }}</span> - {{ task.description }}</p>
            </article>
            <app-view-task-button (click)="editTask(task.id)"></app-view-task-button>
          </section>
        </section>
      </section>
    </li>
  </ul>
  <article class="pagination" *ngIf="total() > pageSize">
    <button (click)="prevPage()" [disabled]="page() <= 0">{{nextButton | translate}}</button>
    <button (click)="nextPage()" [disabled]="page() >= total()">{{backButton | translate}}</button>
  </article>
  <app-back-button></app-back-button>
</section>
