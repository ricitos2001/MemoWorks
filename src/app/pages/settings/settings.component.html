<section class="settings">
  <article class="grid settings__choices">
    <a *ngFor="let t of tabs" [class.active]="activeTab === t.key" (click)="onTabChange(t.key)">{{ t.label }}</a>
  </article>
  <section>
    <h2 class="settings__choice">{{ currentLabel }}</h2>
    <article class="settings__info">
      <router-outlet></router-outlet>
    </article>
  </section>
</section>
